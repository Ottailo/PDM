version: '3.8'

services:
  db:
    image: postgres:15
    container_name: pdm_postgres
    environment:
      POSTGRES_USER: pdm_user
      POSTGRES_PASSWORD: pdm_password
      POSTGRES_DB: pdm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdm_user -d pdm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pdm_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pdm.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
