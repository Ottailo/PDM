<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Radial Depth -->
    <radialGradient id="mv-bg" cx="50%" cy="50%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#181e28"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </radialGradient>
    
    <!-- Metallic Bevel Gradient -->
    <linearGradient id="mv-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="50%" stop-color="rgba(56,189,248,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>

    <!-- Signal Pulse Glow -->
    <filter id="mv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Industrial Chassis Base -->
  <rect width="128" height="128" rx="20" fill="url(#mv-bg)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="18.5" stroke="url(#mv-border-grad)" stroke-width="1.5"/>
  <rect x="7" y="7" width="114" height="114" rx="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Mechatronic Gear & Crosshair Grid Lines -->
  <circle cx="64" cy="64" r="48" stroke="rgba(56,189,248,0.12)" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="64" cy="64" r="36" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="64" y1="12" x2="64" y2="24" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
  <line x1="64" y1="104" x2="64" y2="116" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
  <line x1="12" y1="64" x2="24" y2="64" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
  <line x1="104" y1="64" x2="116" y2="64" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>

  <!-- Mechanical Chassis Corner Fasteners (Allen Bolts) -->
  <circle cx="16" cy="16" r="3" fill="#1f2633" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <circle cx="112" cy="16" r="3" fill="#1f2633" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <circle cx="16" cy="112" r="3" fill="#1f2633" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <circle cx="112" cy="112" r="3" fill="#1f2633" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- Mechatronic Vitality Signal Ribbon (Pulse Waveform) -->
  <path d="M20 64h18l8-22 10 42 12-56 10 44 8-16 8 8h14" 
        stroke="#38bdf8" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#mv-glow)"/>

  <!-- Precision Diagnostic Status Nodes -->
  <circle cx="68" cy="28" r="4.5" fill="#10b981" stroke="#0c0e12" stroke-width="1.5"/>
  <circle cx="56" cy="84" r="4" fill="#f59e0b" stroke="#0c0e12" stroke-width="1.5"/>
  <circle cx="106" cy="64" r="4" fill="#38bdf8" stroke="#0c0e12" stroke-width="1.5"/>
</svg>