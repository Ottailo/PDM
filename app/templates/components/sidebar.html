<!-- Enhanced Sidebar -->
<aside id="sidebar"
    class="w-full lg:w-96 lg:h-screen flex flex-col flex-shrink-0 glassmorphism border-r border-electric-blue/30 relative">
    <!-- Resize Handle (desktop only) -->
    <div id="resize-handle"
        class="absolute right-0 top-0 w-1 h-full bg-electric-blue/30 hover:bg-electric-blue/60 cursor-col-resize transition-colors z-10 hidden lg:block">
    </div>

    <!-- Mobile Dropdown Toggle -->
    <div class="lg:hidden p-4 border-b border-electric-blue/20">
        <button id="sidebar-toggle"
            class="w-full flex items-center justify-between px-4 py-3 bg-gray-800 rounded-lg text-electric-blue font-semibold hover:bg-gray-700 transition-colors">
            <span id="sidebar-toggle-text">Watchlist</span>
            <svg id="sidebar-toggle-icon" class="w-5 h-5 transform transition-transform" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>

        <!-- Mobile Dropdown Menu -->
        <div id="sidebar-dropdown"
            class="hidden mt-2 bg-gray-800 rounded-lg border border-electric-blue/30 overflow-hidden">
            <div class="sidebar-dropdown-item px-4 py-3 cursor-pointer hover:bg-gray-700 transition-colors text-electric-blue"
                data-tab="watchlist">
                🎯 Watchlist
            </div>
            <div class="sidebar-dropdown-item px-4 py-3 cursor-pointer hover:bg-gray-700 transition-colors text-silver"
                data-tab="log">
                📋 Event Log
            </div>
        </div>
    </div>

    <!-- Desktop Tab Headers -->
    <div class="hidden lg:block p-6 border-b border-electric-blue/20">
        <div class="flex space-x-1">
            <div id="tab-watchlist"
                class="sidebar-item sidebar-tab active px-4 py-2 rounded-lg cursor-pointer font-semibold text-electric-blue">
                Watchlist
            </div>
            <div id="tab-log"
                class="sidebar-item sidebar-tab px-4 py-2 rounded-lg cursor-pointer font-semibold text-silver hover:text-electric-blue">
                Event Log
            </div>
        </div>
    </div>

    <!-- Sidebar Content -->
    <div id="watchlist-panel" class="sidebar-panel flex-grow overflow-y-auto p-6">
        <ul id="ttf-list" class="space-y-4"></ul>
    </div>
    <div id="log-panel" class="sidebar-panel flex-grow overflow-y-auto p-6 hidden">
        <ul id="event-log-list" class="space-y-3 text-sm"></ul>
    </div>

    <!-- Admin Link -->
    {% if current_user.is_authenticated and current_user.role == 'admin' %}
    <div class="p-4 border-t border-electric-blue/20 mt-auto">
        <a href="{{ url_for('admin.dashboard') }}"
            class="block w-full text-center px-4 py-2 bg-warning-amber/20 text-warning-amber border border-warning-amber/50 rounded-lg hover:bg-warning-amber/30 transition-colors font-bold">
            🛡️ Admin Dashboard
        </a>
    </div>
    {% endif %}
</aside>
