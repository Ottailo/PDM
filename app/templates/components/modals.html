<!-- History Modal -->
<div id="history-modal-overlay"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden bg-black bg-opacity-75">
    <div id="history-modal-content"
        class="w-full max-w-7xl h-5/6 bg-gradient-to-br from-deep-navy to-gray-900 rounded-xl shadow-2xl border border-electric-blue/30 flex flex-col overflow-hidden">
        <!-- Header -->
        <div
            class="p-6 border-b border-electric-blue/20 flex justify-between items-center bg-gradient-to-r from-deep-navy to-gray-800">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-electric-blue rounded-full animate-pulse"></div>
                <h2 id="history-modal-title" class="text-3xl font-bold text-white font-space">Sensor History</h2>
            </div>
            <button id="history-modal-close"
                class="text-gray-400 hover:text-electric-blue text-4xl font-bold transition-colors duration-300 hover:scale-110 transform">&times;</button>
        </div>

        <!-- Time Range Controls -->
        <div class="p-6 bg-gray-800/50">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-electric-blue">Time Range</h3>
                <div class="text-sm text-gray-400">Select a time period to analyze</div>
            </div>
            <div id="history-time-ranges" class="flex space-x-3">
                <button
                    class="time-range-btn bg-gray-700 hover:bg-electric-blue text-white px-6 py-3 rounded-lg font-semibold transition-all duration-300 hover:scale-105 transform"
                    data-range="1h">Last 1 Hour</button>
                <button
                    class="time-range-btn bg-gray-700 hover:bg-electric-blue text-white px-6 py-3 rounded-lg font-semibold transition-all duration-300 hover:scale-105 transform"
                    data-range="6h">Last 6 Hours</button>
                <button
                    class="time-range-btn bg-gray-700 hover:bg-electric-blue text-white px-6 py-3 rounded-lg font-semibold transition-all duration-300 hover:scale-105 transform"
                    data-range="24h">Last 24 Hours</button>
            </div>
        </div>

        <!-- Chart Container -->
        <div class="flex-grow p-6 relative bg-gradient-to-b from-gray-800/30 to-deep-navy/50">
            <div class="w-full h-full bg-gray-900/50 rounded-lg border border-gray-700 p-4 relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-electric-blue/5 to-neon-cyan/5 rounded-lg"></div>
                <canvas id="history-chart" class="relative z-10"></canvas>
            </div>
        </div>
    </div>
</div>
