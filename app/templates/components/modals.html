<!-- Sensor Telemetry History Modal Dialog -->
<div id="history-modal-overlay"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden pdm-modal-backdrop bg-black/80">
    <div id="history-modal-content"
        class="w-full max-w-5xl h-[85vh] bg-[var(--pdm-surface-overlay)] rounded-[var(--pdm-radius-lg)] shadow-[var(--pdm-shadow-overlay)] border border-[var(--pdm-border-subtle)] flex flex-col overflow-hidden pdm-modal-dialog">

        <!-- Header Strip -->
        <div class="px-5 py-3.5 border-b border-[var(--pdm-border-hairline)] flex justify-between items-center bg-[var(--pdm-surface-raised)]">
            <div class="flex items-center gap-3">
                <span class="w-2 h-2 rounded-full bg-[var(--pdm-accent-base)]"></span>
                <h2 id="history-modal-title" class="font-display font-semibold text-sm tracking-wider uppercase text-[var(--pdm-text-primary)]">
                    SENSOR DEGRADATION HISTORY
                </h2>
            </div>
            <button id="history-modal-close"
                class="pdm-btn py-1 px-2 h-7 bg-transparent border-transparent hover:border-[var(--pdm-border-subtle)] text-[var(--pdm-text-muted)] hover:text-[var(--pdm-text-primary)]"
                title="Close Dialog">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Time Range Selector & Telemetry Bounds Strip -->
        <div class="px-5 py-3 bg-[var(--pdm-surface-sunken)] border-b border-[var(--pdm-border-hairline)] flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <span class="pdm-label text-[10px] text-[var(--pdm-text-muted)]">HORIZON:</span>
                <div id="history-time-ranges" class="pdm-segmented-group">
                    <button class="pdm-segmented-btn time-range-btn active" data-range="1h">1 HOUR</button>
                    <button class="pdm-segmented-btn time-range-btn" data-range="6h">6 HOURS</button>
                    <button class="pdm-segmented-btn time-range-btn" data-range="24h">24 HOURS</button>
                </div>
            </div>
            <div class="flex items-center gap-3 text-xs font-mono text-[var(--pdm-text-muted)]">
                <span class="flex items-center gap-1.5">
                    <span class="w-2.5 h-0.5 bg-[var(--pdm-status-warning)] inline-block"></span>
                    <span>WARNING THRESHOLD</span>
                </span>
                <span class="flex items-center gap-1.5">
                    <span class="w-2.5 h-0.5 bg-[var(--pdm-status-critical)] inline-block"></span>
                    <span>TRIP THRESHOLD</span>
                </span>
            </div>
        </div>

        <!-- Telemetry Multi-Channel Chart Canvas -->
        <div class="flex-grow p-4 relative bg-[var(--pdm-surface-base)]">
            <div class="w-full h-full bg-[var(--pdm-surface-sunken)] rounded-[var(--pdm-radius-sm)] border border-[var(--pdm-border-hairline)] p-3 relative overflow-hidden">
                <canvas id="history-chart" class="w-full h-full"></canvas>
            </div>
        </div>

        <!-- Footer Diagnostic Strip -->
        <div class="px-5 py-2.5 border-t border-[var(--pdm-border-hairline)] bg-[var(--pdm-surface-sunken)] flex items-center justify-between text-[11px] font-mono text-[var(--pdm-text-muted)]">
            <span>INFERENCE MODEL: DUAL-HEAD GRU v2.4</span>
            <span>SAMPLE INTERVAL: 2000ms</span>
        </div>
    </div>
</div>
