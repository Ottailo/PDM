<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDM — Operator Authentication Console</title>

    <!-- DIN-Caliber Instrumentation Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS with OKLCH Theme Architecture -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            future: {
                hoverOnlyWhenSupported: true,
            },
            theme: {
                extend: {
                    colors: {
                        'pdm-canvas': 'var(--pdm-canvas)',
                        'pdm-surface-base': 'var(--pdm-surface-base)',
                        'pdm-surface-raised': 'var(--pdm-surface-raised)',
                        'pdm-surface-overlay': 'var(--pdm-surface-overlay)',
                        'pdm-surface-sunken': 'var(--pdm-surface-sunken)',
                        'pdm-border-hairline': 'var(--pdm-border-hairline)',
                        'pdm-border-subtle': 'var(--pdm-border-subtle)',
                        'pdm-border-strong': 'var(--pdm-border-strong)',
                        'pdm-accent': 'var(--pdm-accent-base)',
                        'pdm-accent-muted': 'var(--pdm-accent-muted)',
                        'pdm-normal': 'var(--pdm-status-normal)',
                        'pdm-warning': 'var(--pdm-status-warning)',
                        'pdm-critical': 'var(--pdm-status-critical)',
                        'pdm-offline': 'var(--pdm-status-offline)',
                        'pdm-text-primary': 'var(--pdm-text-primary)',
                        'pdm-text-secondary': 'var(--pdm-text-secondary)',
                        'pdm-text-muted': 'var(--pdm-text-muted)',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Chakra Petch"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Industrial Design System CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body
    class="bg-[var(--pdm-canvas)] text-[var(--pdm-text-primary)] font-sans antialiased h-screen h-[100dvh] flex items-center justify-center p-4">

    <!-- Console Authentication Card -->
    <div class="w-full max-w-sm bg-[var(--pdm-surface-base)] border border-[var(--pdm-border-subtle)] rounded-[var(--pdm-radius-md)] shadow-[var(--pdm-shadow-md)] overflow-hidden">

        <!-- Header Bar with System ID -->
        <div class="px-5 py-4 border-b border-[var(--pdm-border-hairline)] bg-[var(--pdm-surface-sunken)] flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-[var(--pdm-status-normal)]"></span>
                <span class="font-display font-semibold text-xs tracking-wider text-[var(--pdm-text-primary)] uppercase">PDM // SECURE CONSOLE</span>
            </div>
            <span class="font-mono text-[10px] text-[var(--pdm-text-muted)] uppercase tracking-wider">v3.0.0</span>
        </div>

        <div class="p-6">
            <!-- Console Identifier -->
            <div class="mb-6">
                <h1 class="pdm-display-lg text-[var(--pdm-text-primary)]">OPERATOR LOGIN</h1>
                <p class="text-xs text-[var(--pdm-text-muted)] mt-1 font-sans">Discrete Packaging Line Telemetry Access</p>
            </div>

            <!-- Flashed Messages -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="pdm-degraded-channel mb-4 rounded-sm flex items-center gap-2">
                            <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                            </svg>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Form -->
            <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
                <div>
                    <label class="block pdm-label mb-1.5" for="username">Operator ID / Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                        class="w-full pdm-input focus:border-[var(--pdm-accent-base)]"
                        placeholder="e.g. operator_line1">
                </div>

                <div>
                    <label class="block pdm-label mb-1.5" for="password">Security Credential</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="w-full pdm-input focus:border-[var(--pdm-accent-base)]"
                        placeholder="••••••••">
                </div>

                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center text-xs text-[var(--pdm-text-secondary)] cursor-pointer select-none">
                        <input type="checkbox" name="remember" class="mr-2 accent-[var(--pdm-accent-base)]">
                        <span>Persist Session</span>
                    </label>
                </div>

                <button type="submit"
                    class="w-full pdm-btn pdm-btn-primary mt-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    <span>Authenticate</span>
                </button>
            </form>

            <!-- Diagnostic Hint -->
            <div class="mt-6 pt-4 border-t border-[var(--pdm-border-hairline)] flex items-center justify-between text-[11px] font-mono text-[var(--pdm-text-muted)]">
                <span>SYSTEM: READY</span>
                <span>SEC: LEVEL-3</span>
            </div>
        </div>
    </div>

</body>

</html>
